<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Steam Currency Lens</title>
  <link rel="stylesheet" href="popup.css">
  <script src="shared.js" defer></script>
  <script src="price-parser.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="theme.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="refresh-icon" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6.1 7a7 7 0 0 1 11.6-1L20 9M4 15l2.3 3A7 7 0 0 0 18 17"/></symbol>
    <symbol id="arrow-icon" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="check-icon" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="clock-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="link-icon" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4 10 14M10 4H4v16h16v-6"/></symbol>
    <symbol id="cursor-icon" viewBox="0 0 24 24"><path d="M5 3.5 18.5 13l-6 1.3 3.4 6.6-2.7 1.3-3.3-6.7L5 19.6Z"/></symbol>
    <symbol id="calc-icon" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 18.5h.01M12 18.5h4"/></symbol>
    <symbol id="gear-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
    <symbol id="back-icon" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="copy-icon" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="grip-icon" viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
    <symbol id="list-icon" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></symbol>
  </svg>
  <main>
    <header class="header">
      <div class="brand"><img src="icons/48.png" alt="" width="38" height="38"><div><h1>Currency Lens<span>for Steam</span></h1><p data-i18n="subtitle"></p></div></div>
      <label id="enabled-switch" class="power" data-i18n-title="enabled"><span id="power-state" class="power-state"></span><span class="switch"><input id="enabled" type="checkbox" role="switch" data-i18n-aria="enabled"><span></span></span></label>
    </header>

    <section id="setup" class="setup" aria-labelledby="setup-title" hidden>
      <div class="setup-top"><div class="setup-progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div><span id="setup-count" class="setup-count" aria-live="polite"></span></div>
      <div id="setup-body" class="setup-body">
        <div class="setup-step" data-step="0">
          <h2 class="setup-title" tabindex="-1">Language</h2>
          <p class="setup-hint" data-i18n="setupLanguageHint"></p>
          <div id="setup-languages" class="language-grid" role="group" aria-label="Language"></div>
        </div>
        <div class="setup-step" data-step="1" hidden>
          <h2 class="setup-title" tabindex="-1" data-i18n="setupCurrencyTitle"></h2>
          <p class="setup-hint" data-i18n="setupCurrencyHint"></p>
          <div class="setup-pair">
            <label class="setup-field"><span data-i18n="setupFrom"></span><select id="setup-source" data-i18n-aria="setupFrom"></select><small id="setup-source-name"></small></label>
            <svg class="pair-arrow"><use href="#arrow-icon"/></svg>
            <label class="setup-field"><span data-i18n="setupTo"></span><select id="setup-target" data-i18n-aria="setupTo"></select><small id="setup-target-name"></small></label>
          </div>
          <p id="setup-rate" class="setup-rate" aria-live="polite"></p>
        </div>
        <div class="setup-step" data-step="2" hidden>
          <h2 class="setup-title" tabindex="-1" data-i18n="display"></h2>
          <p class="setup-hint" data-i18n="setupDisplayHint"></p>
          <div class="mode-list" role="group" data-i18n-aria="display">
            <button type="button" class="mode-card" data-mode="dual"><span class="mode-radio"></span><span class="mode-copy"><strong data-i18n="modeDual"></strong><small data-i18n="modeDualHint"></small></span><span class="scene" data-scene="dual" aria-hidden="true"></span></button>
            <button type="button" class="mode-card" data-mode="hover"><span class="mode-radio"></span><span class="mode-copy"><strong data-i18n="modeHover"></strong><small data-i18n="modeHoverHint"></small></span><span class="scene" data-scene="hover" aria-hidden="true"></span></button>
            <button type="button" class="mode-card" data-mode="converted"><span class="mode-radio"></span><span class="mode-copy"><strong data-i18n="modeConverted"></strong><small data-i18n="modeConvertedHint"></small></span><span class="scene" data-scene="converted" aria-hidden="true"></span></button>
          </div>
        </div>
        <div class="setup-step setup-finish" data-step="3" hidden>
          <span class="finish-icon" aria-hidden="true"><svg><use href="#check-icon"/></svg></span>
          <h2 class="setup-title" tabindex="-1" data-i18n="setupDoneTitle"></h2>
          <p class="setup-hint" data-i18n="setupDoneHint"></p>
          <dl class="summary">
            <div><dt data-i18n="language"></dt><dd id="summary-language"></dd></div>
            <div><dt data-i18n="setupCurrencyTitle"></dt><dd id="summary-currencies"></dd></div>
            <div><dt data-i18n="display"></dt><dd id="summary-display"></dd></div>
          </dl>
        </div>
      </div>
      <div class="setup-actions"><button id="setup-back" class="ghost-button" type="button" data-i18n="back"></button><button id="setup-next" class="primary-button" type="button"></button></div>
    </section>

    <div id="app" hidden>
      <section id="prices-panel" class="view">
        <section class="rate-card">
          <div class="card-top"><span class="eyebrow" data-i18n="internalRate"></span><span id="mode-badge" class="badge"><span></span><b></b></span></div>
          <div class="pair-grid">
            <label><span data-i18n="from"></span><select id="source-currency" data-i18n-aria="from"></select></label>
            <svg class="pair-arrow"><use href="#arrow-icon"/></svg>
            <label><span data-i18n="to"></span><select id="target-currency" data-i18n-aria="to"></select></label>
          </div>
          <div class="rate-value" aria-live="polite"><span id="unit-value"></span><span class="rate-equals">=</span><strong id="rate-value">—</strong></div>
          <div class="rate-bottom"><div><span id="rate-status"></span><small id="provider-date"></small></div><button id="refresh" class="icon-button" type="button" data-i18n-title="refresh" data-i18n-aria="refresh"><svg><use href="#refresh-icon"/></svg></button></div>
        </section>
        <p id="error" class="error" role="status" hidden></p>

        <section class="manual-card">
          <div class="setting-row"><div class="row-copy"><strong data-i18n="manualToggle"></strong><small data-i18n="manualHint"></small></div><label class="switch"><input id="manual-enabled" type="checkbox" role="switch" data-i18n-aria="manualToggle"><span></span></label></div>
          <div id="manual-fields" hidden><label class="field-label" id="manual-unit" for="manual-rate"></label><div class="manual-input-wrap"><input id="manual-rate" type="text" inputmode="decimal" autocomplete="off" maxlength="40" placeholder="0.1871"><span id="manual-target"></span></div><p id="manual-validation" class="validation" hidden data-i18n="validRate"></p><p id="manual-only" class="small-note"></p></div>
        </section>

        <section class="calculator-card">
          <div class="calculator-header"><strong data-i18n="calculator"></strong><span id="calculator-source"></span></div>
          <div class="calculator-grid"><input id="calculator-amount" type="text" inputmode="decimal" value="1000" maxlength="24" data-i18n-aria="amount"><svg><use href="#arrow-icon"/></svg><output id="calculator-result" for="calculator-amount" data-i18n-aria="result">—</output></div>
        </section>
        <div class="page-status"><span class="status-dot"></span><span id="page-stats"></span></div>
        <nav class="bottom-nav"><button id="open-calculator" class="nav-button" type="button"><svg><use href="#calc-icon"/></svg><span data-i18n="calculatorTitle"></span></button><button id="open-settings" class="nav-button" type="button"><svg><use href="#gear-icon"/></svg><span data-i18n="settings"></span></button></nav>
      </section>

      <section id="calculator-panel" class="view" aria-labelledby="calculator-title" hidden>
        <header class="view-header"><button class="back-button" type="button" data-back data-i18n-aria="back" data-i18n-title="back"><svg><use href="#back-icon"/></svg></button><h2 id="calculator-title" data-i18n="calculatorTitle"></h2><span id="calc-meta" class="view-meta"></span></header>
        <div id="calc-list">
          <section class="calc-input">
            <label class="field-label" for="calc-amount" data-i18n="amount"></label>
            <div class="calc-input-row"><input id="calc-amount" type="text" inputmode="decimal" maxlength="24" autocomplete="off" value="1000"><select id="calc-source" data-i18n-aria="setupFrom"></select></div>
          </section>
          <section id="calc-rows" class="calc-rows"></section>
          <button id="calc-edit" class="ghost-button wide" type="button"><svg><use href="#list-icon"/></svg><span data-i18n="calcEdit"></span></button>
          <div class="calc-foot"><span id="calc-status" aria-live="polite"></span><button id="calc-refresh" class="icon-button" type="button" data-i18n-title="refresh" data-i18n-aria="refresh"><svg><use href="#refresh-icon"/></svg></button></div>
        </div>
        <div id="calc-picker" hidden>
          <p class="calc-hint" data-i18n="calcHint"></p>
          <div id="calc-grid" class="currency-grid" role="group" data-i18n-aria="calcEdit"></div>
          <button id="calc-done" class="primary-button wide" type="button" data-i18n="done"></button>
        </div>
        <p id="calc-announce" class="visually-hidden" aria-live="polite"></p>
      </section>

      <section id="settings-panel" class="view" aria-labelledby="settings-title" hidden>
        <header class="view-header"><button class="back-button" type="button" data-back data-i18n-aria="back" data-i18n-title="back"><svg><use href="#back-icon"/></svg></button><h2 id="settings-title" data-i18n="settings"></h2></header>
        <section class="settings-card">
          <div class="setting-row language-row"><div class="row-copy"><strong data-i18n="language"></strong></div><select id="language-select" data-i18n-aria="language"></select></div>
          <div class="settings-block"><strong data-i18n="precision"></strong><small data-i18n="precisionHint"></small><div class="precision" role="group" data-i18n-aria="precision"><button type="button" data-precision="0">0</button><button type="button" data-precision="2">2</button><button type="button" data-precision="auto" data-i18n="autoDigits"></button></div></div>
          <div class="display-block">
            <strong data-i18n="display"></strong>
            <div class="modes" role="group" data-i18n-aria="display"><button type="button" data-mode="dual" data-i18n="modeDual"></button><button type="button" data-mode="hover" data-i18n="modeHover"></button><button type="button" data-mode="converted" data-i18n="modeConverted"></button></div>
            <div id="display-preview" class="display-preview" aria-hidden="true"></div>
          </div>
          <div class="theme-block">
            <div class="row-copy"><strong data-i18n="theme"></strong></div>
            <div class="theme-options">
              <div id="swatches" class="swatches" role="group" data-i18n-aria="theme"></div>
              <button id="custom-color" class="custom-color" type="button" aria-expanded="false" aria-controls="color-picker"><span class="custom-dot"></span><span data-i18n="customColor"></span></button>
            </div>
            <div id="color-picker" class="color-picker" role="dialog" data-i18n-aria="customColor" hidden>
              <div id="sv-area" class="sv-area" tabindex="0" role="slider" aria-valuemin="0" aria-valuemax="100" data-i18n-aria="saturation"><svg id="sv-mask" class="sv-mask" aria-hidden="true"><defs><pattern id="sv-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#090d16b8"/><path d="M0 0v6"/></pattern></defs><path id="sv-mask-fill" fill="url(#sv-hatch)"/><path id="sv-mask-line" class="sv-mask-line"/></svg><span id="sv-thumb" class="sv-thumb"></span></div>
              <input id="hue" class="hue" type="range" min="0" max="359" step="1" value="0" data-i18n-aria="hue">
              <div class="picker-row"><span class="picker-preview"></span><input id="hex-input" class="hex-input" type="text" maxlength="7" spellcheck="false" autocomplete="off" data-i18n-aria="hex"><button id="picker-done" class="picker-done" type="button" data-i18n="done"></button></div>
              <p id="picker-note" class="picker-note" data-i18n="tooDark" hidden></p>
            </div>
          </div>
        </section>
        <section class="cache-card"><svg><use href="#clock-icon"/></svg><div><strong data-i18n="cacheTitle"></strong><p data-i18n="cacheHint"></p></div></section>
        <section id="source-card" class="source-card" hidden><span class="eyebrow" data-i18n="source"></span><a class="source-link" href="https://steam-currency.ru/" target="_blank" rel="noopener noreferrer"><strong>steam-currency.ru</strong><svg><use href="#link-icon"/></svg></a></section>
        <footer class="settings-foot"><span id="version"></span><a class="author-link" href="https://steamcommunity.com/id/itoxi/" target="_blank" rel="noopener noreferrer">by toxi</a></footer>
      </section>
    </div>
  </main>
</body>
</html>
